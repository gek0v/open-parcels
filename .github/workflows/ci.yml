name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests with race detector and coverage
        run: go test -v -race -cover ./...

      - name: Build binary
        run: go build -v -o open-parcels .
