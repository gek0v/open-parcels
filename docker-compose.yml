services:
  open-parcels:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "v1.0.0"
    container_name: open-parcels-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GIN_MODE=release
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
